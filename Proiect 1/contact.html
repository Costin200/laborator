<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portofoliul meu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Epure Robert Costin</a>
            <button class="hamburger" aria-label="Deschide meniul">☰</button>
            <ul class="nav-menu">
                <li><a href="index.html">Acasă</a></li>
                <li><a href="about.html">Despre</a></li>
                <li><a href="projects.html">Proiecte</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Contactează-mă</h1>

        <form id="contact-form" novalidate>
            <label for="name">Nume *</label>
            <input type="text" id="name">
            <span class="error" id="name-error"></span>

            <label for="email">Email *</label>
            <input type="email" id="email">
            <span class="error" id="email-error"></span>

            <label for="phone">Telefon (opțional)</label>
            <input type="tel" id="phone">
            <span class="error" id="phone-error"></span>

            <label for="message">Mesaj *</label>
            <textarea id="message" rows="5"></textarea>
            <small id="counter">0 / 1000</small>
            <span class="error" id="message-error"></span>

            <button type="submit" class="btn">Trimite</button>
            <p id="success" class="success"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Epure Robert Costin</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
